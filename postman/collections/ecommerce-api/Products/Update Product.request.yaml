$kind: http-request
name: Update Product
order: 4000
method: PUT
url: '{{baseUrl}}/api/products/{{productId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "price": 899.99,
      "stock": 45
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Response has success: true", function() {
        pm.expect(pm.response.json().success).to.be.true;
      });
      pm.test("Response data.price equals 899.99", function() {
        pm.expect(pm.response.json().data.price).to.eql(899.99);
      });
