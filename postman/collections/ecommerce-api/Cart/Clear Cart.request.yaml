$kind: http-request
name: Clear Cart
order: 4000
method: DELETE
url: '{{baseUrl}}/api/cart'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "userId": "{{userId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Response has success: true", function() {
        pm.expect(pm.response.json().success).to.be.true;
      });
      pm.test('Response has message "Cart cleared successfully."', function() {
        pm.expect(pm.response.json().message).to.eql("Cart cleared successfully.");
      });
